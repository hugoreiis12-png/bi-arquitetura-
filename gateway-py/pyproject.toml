[project]
name = "tmdl-gateway"
version = "0.1.0"
description = "Gateway Python separado: versionamento Power BI so-TMDL (pull/commit/DAX RUN local)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
tmdl-gateway = "tmdl_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmdl_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
