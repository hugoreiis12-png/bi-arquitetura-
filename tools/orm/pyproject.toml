[project]
name = "powerbi-orm"
version = "0.4.0"
description = "Python ORM for Power BI semantic models (Tabular/TMDL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BI Team", email = "bi@empresa.com" }
]
keywords = ["powerbi", "bi", "orm", "dax", "tabular", "tmdl", "tom"]

dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "msal>=1.28.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "python-gitlab>=4.0.0",
    "pygithub>=2.3.0",
    "pyadomd>=0.1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_orm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
