[project]
name = "powerbi-mcp-server"
version = "1.0.0"
description = "MCP server for Power BI — AI-augmented BI development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BI Team", email = "bi@empresa.com" }
]
keywords = ["mcp", "powerbi", "bi", "ai", "dax"]

dependencies = [
    "fastmcp>=0.4.0,<1",
    "mcp>=1.0.0,<2",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b23",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
    "powerbi-orm>=0.4.0",
]

[project.optional-dependencies]
# Consulta XMLA ao vivo (execução real de DAX). Requer .NET + ADOMD.NET no host.
# Opcional: nada no server/testes importa pyadomd no nível de módulo.
xmla = [
    "pyadomd>=0.1.1; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
]

[project.scripts]
powerbi-mcp = "powerbi_mcp.server:main"
powerbi-mcp-admin = "powerbi_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
