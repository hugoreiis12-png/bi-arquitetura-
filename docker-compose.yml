# bi-architecture p/ Portainer (Stacks > Add stack > Repository ou Web editor)
# ---------------------------------------------------------------------------
# PORTAINER (passo a passo):
#  1. Stacks > Add stack > nome: bi-architecture > cole este arquivo (Web editor)
#     ou aponte Repository p/ este repo (compose path: docker-compose.yml).
#  2. Environment variables (Advanced > ou Stack env): OBRIGATÓRIAS —
#       PBI_TENANT_ID, PBI_SP_CLIENT_ID, PBI_SP_CLIENT_SECRET,
#       PBI_WORKSPACE_ID  (workspace único/dinâmico do projeto conectado)
#     OPCIONAIS —
#       PBI_WORKSPACE_NAME, PBI_DATASET_NAME=Vendas, MCP_HOST_PORT=8001,
#       REDIS_URL=redis://redis:6379/0
#     (NUNCA commite segredos: use o env do Portainer, não .env no repo.)
#  3. Deploy the stack. Aguarde healthcheck `healthy` em bi-mcp.
# HOST DESTE STACK: 192.168.0.160 (Portainer neste IP)
# A porta 8000 do host já está ocupada por outro serviço: o gateway é publicado
# em 8011 (GATEWAY_HOST_PORT=8011 no env do stack; default do compose seria 8001).
# ATENÇÃO: a URL pública segue a porta PUBLICADA (8011), não a interna (8000).
# CONSUMO VIA MCP (clientes: LibreChat, opencode, Cline, Continue, Claude Desktop, VS Code):
#  - ÚNICA URL pública (gateway único, Streamable HTTP POST /mcp):
#      http://192.168.0.160:8011/mcp  (localhost:8011 a partir do próprio host)
#  - bi-mcp e dax-staff NÃO têm porta publicada (só `expose` interno): não aponte
#    o cliente MCP direto para eles; use sempre o gateway acima.
#  - CLI no container:  docker exec -it bi-mcp tmdl-gateway pull-propose ...
# ---------------------------------------------------------------------------
name: bi-architecture

services:
  bi-mcp:
    build: .
    image: bi-architecture:latest
    container_name: bi-mcp
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      PBI_TENANT_ID: ${PBI_TENANT_ID:?Defina PBI_TENANT_ID no env do Portainer}
      PBI_SP_CLIENT_ID: ${PBI_SP_CLIENT_ID:?Defina PBI_SP_CLIENT_ID}
      PBI_SP_CLIENT_SECRET: ${PBI_SP_CLIENT_SECRET:?Defina PBI_SP_CLIENT_SECRET}
      PBI_WORKSPACE_ID: ${PBI_WORKSPACE_ID:?Defina PBI_WORKSPACE_ID (único/dinâmico)}
      PBI_WORKSPACE_NAME: ${PBI_WORKSPACE_NAME:-}
      PBI_DATASET_NAME: ${PBI_DATASET_NAME:-Vendas}
      REDIS_URL: redis://redis:6379/0
      REQUIRE_TWO_APPROVERS_FOR_PROD: "true"
    volumes:
      # Trabalho versionado fora da imagem (opcional; comente p/ imagem imutável)
      - ./src:/app/src
      - ./tests:/app/tests
      - bi-repos:/tmp/bi-repos
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  dax-staff:
    image: bi-architecture:latest
    container_name: bi-dax-staff
    restart: unless-stopped
    command: ["node", "/app/build/index.js", "--http"]
    environment:
      DAX_MCP_HOST: 0.0.0.0
      DAX_MCP_PORT: 8001
      PYTHON_BIN: python
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8001),timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bi-gateway:
    image: bi-architecture:latest
    container_name: bi-gateway
    restart: unless-stopped
    command: ["node", "/app/build/mcp-gateway/index.js"]
    ports:
      # Única porta MCP consumida pelo cliente externo.
      - "${MCP_HOST_PORT:-8011}:8000"
    environment:
      DAX_BACKEND_URL: http://dax-staff:8001/mcp
      PBI_BACKEND_URL: http://bi-mcp:8000/mcp
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
    depends_on:
      bi-mcp:
        condition: service_healthy
      dax-staff:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: bi-redis
    restart: unless-stopped
    volumes:
      - bi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  dax-staff:
    build: .
    image: bi-architecture:latest
    container_name: bi-dax-staff
    restart: unless-stopped
    command: ["node", "build/index.js", "--http"]
    expose:
      - "8001"
    environment:
      DAX_MCP_HOST: 0.0.0.0
      DAX_MCP_PORT: 8001
      PYTHON_BIN: python
    volumes:
      # Trabalho versionado fora da imagem (opcional; comente p/ imagem imutável)
      - ./src:/app/src
      - bi-repos:/tmp/bi-repos
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8001),timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  bi-gateway:
    build: .
    image: bi-architecture:latest
    container_name: bi-gateway
    restart: unless-stopped
    command: ["node", "build/mcp-gateway/index.js"]
    ports:
      # ÚNICA URL pública do ecossistema MCP: http://<host>:${GATEWAY_HOST_PORT}/mcp
      # (deploy atual: GATEWAY_HOST_PORT=8011 → http://<host>:8011/mcp)
      - "${GATEWAY_HOST_PORT:-8001}:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      DAX_BACKEND_URL: http://dax-staff:8001/mcp
      PBI_BACKEND_URL: http://bi-mcp:8000/mcp
    depends_on:
      bi-mcp:
        condition: service_healthy
      dax-staff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  bi-repos:
  bi-redis-data:
